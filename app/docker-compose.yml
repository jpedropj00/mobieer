services:
  db:
    image: postgres:16-alpine
    container_name: mobieer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mobieer
      POSTGRES_PASSWORD: mobieer_dev_2026
      POSTGRES_DB: mobieer
    ports:
      - "5434:5432"
    volumes:
      - mobieer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobieer -d mobieer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mobieer_pgdata:
